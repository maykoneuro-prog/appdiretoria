    <script>
      (function () {
        function isExtensionOrMetaMaskError(msg, stack, filename) {
          var combined = String(msg || '') + ' ' + String(stack || '') + ' ' + String(filename || '');
          return (
            combined.indexOf('MetaMask') !== -1 ||
            combined.indexOf('ethereum') !== -1 ||
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('inpage.js') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (event) {
            if (
              isExtensionOrMetaMaskError(
                event.message,
                event.error && event.error.stack,
                event.filename
              )
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            var msg = reason && (reason.message || String(reason));
            var stack = reason && reason.stack;
            if (isExtensionOrMetaMaskError(msg, stack, '')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
      })();
    </script>
